services:
  postgres:
    image: postgres:16-alpine
    container_name: qr_order_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-qr_order_db}
      POSTGRES_USER: ${DB_USERNAME:-qr_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Cần đặt DB_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./qr-order-backend
    container_name: qr-order-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-qr_order_db}
      DB_USERNAME: ${DB_USERNAME:-qr_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Cần đặt JWT_SECRET (Base64, >= 32 byte) trong .env}
      JWT_ISSUER: ${JWT_ISSUER:-qr-order}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_FULL_NAME: ${INITIAL_ADMIN_FULL_NAME:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-qr-order/products}
      MENU_IMAGE_MAX_SIZE: ${MENU_IMAGE_MAX_SIZE:-5MB}
      QR_BASE_URL: ${QR_BASE_URL:-}
      QR_TOKEN_SECRET: ${QR_TOKEN_SECRET:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres_data: